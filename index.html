<style>
/* Layout: app de uma coluna, fundo preto, uma flor recortada brilhando por tela; navegação de quatro abas embaixo */
:root {
  --bg: #050605; --surface: #0E110F; --glass: rgba(255,255,255,.055); --glass2: rgba(255,255,255,.09); --line: rgba(255,255,255,.09);
  --fg: #F1F3EE; --fg2: #9AA39B; --fg3: #5F675F;
  --acc: #E2A54A; --accInk: #140D02; --glow: rgba(226,165,74,.5); --glow2: rgba(226,120,40,.22);
  --c1: #E58B6F; --c2: #E3C25A; --c3: #74BEDB;
  --fD: "Bricolage Grotesque", "Figtree", system-ui, sans-serif; --fB: "Figtree", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; background: var(--bg); color: var(--fg); }
body { margin: 0; font-family: var(--fB); font-size: 15px; line-height: 1.5; overflow: hidden; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: inherit; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--acc); outline-offset: 2px; }
#app { height: 100%; max-width: 560px; margin: 0 auto; position: relative; display: flex; flex-direction: column; border-inline: 1px solid transparent; }
@media (min-width: 600px) { #app { border-inline-color: var(--line); } }
.view { flex: 1; overflow-y: auto; overflow-x: hidden; scrollbar-width: none; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); padding-block: 14px 28px; }
.view::-webkit-scrollbar { display: none; }
.stack { display: flex; flex-direction: column; gap: 26px; }
.mark { width: 22px; height: 22px; flex: none; }
.brand { display: flex; align-items: center; gap: 8px; font-family: var(--fD); font-weight: 600; font-size: 19px; letter-spacing: -.01em; }
h1, h2, h3, p { margin: 0; }
.h1 { font-family: var(--fD); font-weight: 600; font-size: 30px; line-height: 1.08; letter-spacing: -.02em; text-wrap: balance; }
.h3 { font-weight: 600; font-size: 16.5px; display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }

.sub { color: var(--fg2); font-size: 14.5px; }
.sec { display: flex; flex-direction: column; gap: 12px; }
.find { display: flex; align-items: center; gap: 10px; width: 100%; background: var(--glass); border: 1px solid var(--line); border-radius: 999px; padding: 13px 18px; color: var(--fg2); font-size: 15px; }
.find svg { width: 18px; height: 18px; flex: none; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1px solid var(--line); background: var(--glass); border-radius: 999px; padding: 8px 14px; font-size: 14px; white-space: nowrap; }
.chip[aria-pressed="true"] { background: var(--acc); color: var(--accInk); border-color: transparent; font-weight: 600; }
.row { display: flex; gap: 12px; overflow-x: auto; scrollbar-width: none; margin-inline: -20px; padding-inline: 20px; scroll-snap-type: x proximity; }
.row::-webkit-scrollbar { display: none; }

.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--cc, var(--c1)); flex: none; }

/* abertura */
.intro { position: absolute; inset: 0; z-index: 30; background: var(--bg); display: grid; grid-template-rows: auto 1fr auto 1fr auto; justify-items: center; text-align: center; padding: calc(16px + env(safe-area-inset-top, 0px)) max(28px, env(safe-area-inset-right, 0px)) calc(30px + env(safe-area-inset-bottom, 0px)) max(28px, env(safe-area-inset-left, 0px)); cursor: pointer; }

.pill { background: var(--fg); color: var(--bg); font-weight: 600; border-radius: 999px; padding: 15px 0; width: 100%; max-width: 360px; font-size: 16px; text-align: center; align-self: end; }
.dots { display: flex; gap: 6px; justify-content: center; margin-top: 16px; }

.fade { animation: fade .6s ease both; }
@keyframes fade { from { opacity: 0; transform: translateY(6px); } }
/* transições da abertura */
.intro .say, .intro .tap, .intro .logo, .intro .ibtn { transition: opacity .32s ease, transform .32s ease, filter .32s ease; }
.intro.out .say, .intro.out .tap, .intro.out .logo { opacity: 0; transform: translateY(-12px); filter: blur(5px); }
.intro.out .logo { transform: scale(.86); }
.intro.out .seed { animation: seedOut .38s ease-in forwards; }
.intro.enter .say { animation: sayIn .7s cubic-bezier(.2,.8,.2,1) both; }
.intro.enter .tap { animation: sayIn .7s cubic-bezier(.2,.8,.2,1) .35s both; }
.intro.enter .logo { animation: sayIn .8s cubic-bezier(.2,.8,.2,1) both; }
.intro.enter.s1 .seed { animation: seedIn 1.1s cubic-bezier(.2,.9,.25,1.25) .15s both, seedFloat 3.4s ease-in-out 1.3s infinite; }
.intro.enter.s1 .obj::before { animation: glowIn 1.4s ease .2s both; }
.intro.enter.s2 .obj img { animation: budIn 1.1s cubic-bezier(.2,.8,.2,1) .05s both; }
.intro .obj img { transition: filter 1.4s ease; }
.intro .obj::before { transition: opacity 1.4s ease, transform 1.4s ease; }
.intro.bloom .obj::before { animation: bloom 1.6s ease both; }
.intro.bloom .say { animation: sayIn .8s cubic-bezier(.2,.8,.2,1) both; }
.intro.bloom .ibtn { animation: sayIn .8s cubic-bezier(.2,.8,.2,1) .5s both; }
.intro.exit { animation: introExit .7s cubic-bezier(.6,0,.4,1) forwards; pointer-events: none; }
@keyframes sayIn { from { opacity: 0; transform: translateY(16px); filter: blur(6px); } }
@keyframes seedIn { from { opacity: 0; transform: scale(0) rotate(-40deg); } 60% { opacity: 1; } }
@keyframes seedFloat { 50% { transform: translateY(-6px) rotate(4deg); } }

/* busca */
.over { position: absolute; inset: 0; z-index: 20; background: var(--bg); display: flex; flex-direction: column; }
.sbar { display: flex; gap: 10px; align-items: center; padding: calc(12px + env(safe-area-inset-top, 0px)) max(20px, env(safe-area-inset-right, 0px)) 10px max(20px, env(safe-area-inset-left, 0px)); }

.item { display: grid; grid-template-columns: 56px minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); width: 100%; }

.topb { position: absolute; top: calc(12px + env(safe-area-inset-top, 0px)); left: max(16px, env(safe-area-inset-left, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); display: flex; justify-content: space-between; z-index: 2; pointer-events: none; }

  // ---------- árvore (pop-up) ----------
  const TW = 104, TH = 128, GX = 14, GY = 54, PAD = 28, DEPTH = 3;
  const UPN = ['Pais', 'Avós', 'Bisavós'];
  function pedigree(s, d) {
    const n = { s, d, ch: [] };
    if (d < DEPTH) n.ch = [...mp(s).map(p => pedigree(by[p], d + 1)), ...(d === 0 || true ? un(s).map(g => ({ ghost: g, d: d + 1, ch: [], w: TW })) : [])];

  function place(n, x0) { n.x = x0 + n.w / 2; let cx = x0 + (n.w - (n.ch.reduce((t, c) => t + c.w, 0) + GX * Math.max(0, n.ch.length - 1))) / 2; n.ch.forEach(c => { place(c, cx); cx += c.w + GX; }); }
  function flat(n, out = []) { out.push(n); n.ch.forEach(c => flat(c, out)); return out; }
  function treeHTML() {
    const T = st.tree, r = by[T.root], P = pedigree(r, 0); place(P, 0);
    const nodes = flat(P), D = Math.max(...nodes.map(n => n.d));
    const kidsAll = r.kids.map(k => by[k]).sort((a, b) => b.kids.length - a.kids.length);
    const KMAX = 12, kids = T.all ? kidsAll : kidsAll.slice(0, KMAX), extra = kidsAll.length - kids.length;
    const kn = kids.length + (extra > 0 ? 1 : 0), kw = kn ? kn * TW + (kn - 1) * GX : 0;
    const W = Math.max(P.w, kw) + PAD * 2, shift = W / 2 - P.x;

    nodes.forEach(n => { n.x += shift; n.y = yOf(n.d); });
    let lines = '', marks = '';
    nodes.forEach(n => {
      if (!n.ch.length) return;
      const top = n.y, mid = top - GY / 2;
      n.ch.forEach(c => { lines += `<path d="M${n.x} ${top} V${mid} H${c.x} V${c.y + TH}"/>`; });
      if (n.ch.length === 2) marks += `<span class="tx" style="left:${n.x}px;top:${mid}px">×</span>`;
    });
    const kx0 = W / 2 - kw / 2;
    if (kn) { const mid = ry + TH + GY / 2 + 11; for (let i = 0; i < kn; i++) { const x = kx0 + i * (TW + GX) + TW / 2; lines += `<path class="dn" d="M${W / 2} ${ry + TH} V${mid} H${x} V${ky}"/>`; } }
    const other = k => { const o = mp(k).filter(p => p !== r.id).map(p => by[p].n).concat(un(k)); return o.length ? '× ' + o[0] : 'seleção'; };
    const card = (n) => n.ghost
      ? `<div class="tn ghost" style="left:${n.x - TW / 2}px;top:${n.y}px"><span class="im">${I.leaf}</span><b>${esc(n.ghost)}</b><small>sem ficha</small></div>`
      : `<button class="tn${n.d === 0 ? ' me' : ''}" data-troot="${n.s.id}" style="left:${n.x - TW / 2}px;top:${n.y}px;--g:${glowOf(n.s)}"><span class="im">${pic(n.s)}</span><b>${esc(n.s.n)}</b><small>${n.d === 0 ? 'você está aqui' : n.more ? '+ mais antigas' : !n.s.p.length && !n.s.unk ? 'nativa' : kind(n.s)}</small></button>`;
    const kcard = (k, i) => `<button class="tn" data-troot="${k.id}" style="left:${kx0 + i * (TW + GX)}px;top:${ky}px;--g:${glowOf(k)}"><span class="im">${pic(k)}</span><b>${esc(k.n)}</b><small>${esc(other(k))}</small></button>`;
    const labels = [];
    for (let d = 1; d <= D; d++) { const xs = nodes.filter(n => n.d === d).map(n => n.x - TW / 2); labels.push(`<span class="tl" style="left:${Math.min(...xs)}px;top:${yOf(d) - 22}px">${UPN[d - 1]}</span>`); }
    if (kn) labels.push(`<span class="tl" style="left:${kx0}px;top:${ky - 22}px">Descendentes · ${kidsAll.length}</span>`);
    const prev = T.hist.length ? by[T.hist[T.hist.length - 1]] : null;
    return `<div class="tree${st.twipe ? ' in' : ''}" role="dialog" aria-label="Árvore genealógica de ${esc(r.n)}">
      <div class="thd2">${prev ? `<button class="rb" data-tprev aria-label="Voltar pra ${esc(prev.n)}">${I.back}</button>` : '<span style="width:40px"></span>'}
        <div class="tt"><b>Árvore de ${esc(r.n)}</b><small>${prev ? 'voltar pra ' + esc(prev.n) : 'Toque numa strain pra ver a árvore dela'}</small></div>
        <button class="rb" data-tclose aria-label="Fechar árvore">${I.x}</button></div>

        ${nodes.map(card).join('')}${kids.map(kcard).join('')}${extra > 0 ? `<button class="tn more" data-tall style="left:${kx0 + kids.length * (TW + GX)}px;top:${ky}px"><span class="im">+${extra}</span><b>Ver todas</b><small>${kidsAll.length} descendentes</small></button>` : ''}
        ${!r.p.length ? `<p class="tnote" style="top:${ry - 34}px">${r.unk ? 'Origem sem registro confiável' : 'Variedade nativa: a história começa aqui'}</p>` : ''}

    </div>`;
  }

    st.mapW = el.clientWidth;
    const sameMap = c === st.ctry && (reg === 'none' || st.reg === 'none') && !(reg && reg !== 'none') && !(st.reg && st.reg !== 'none');
    const from = (st.vb || WORLD).slice(), to = c ? (reg ? regBox(c, reg, el) : fitBox(c, el)) : WORLD;
    st.ctry = c; st.reg = reg; st.ctryAll = false; st.vbT = to;
    if (sameMap) { document.getElementById('mui').innerHTML = mapUI(c, reg); document.getElementById('mrest').innerHTML = mapRest(c, reg); return; }
    // camada nova entra em fade, a antiga sai em fade
    const zl = document.getElementById('zl');
    zl.querySelectorAll(':scope > g').forEach(g => { g.classList.add('zout'); setTimeout(() => g.remove(), 450); });
    if (c) { const g = document.createElementNS('http://www.w3.org/2000/svg', 'g'); g.setAttribute('class', 'zin'); g.innerHTML = zoomLayer(c, to, reg); zl.appendChild(g); }
    document.querySelectorAll('#mb .cdot').forEach(g => { const k = g.dataset.ctry; g.classList.toggle('dim', !!c && k !== c); g.classList.toggle('gone', k === c); });
    el.parentNode.classList.toggle('z', !!c);
    document.getElementById('mui').innerHTML = mapUI(c, reg);
    document.getElementById('mrest').innerHTML = mapRest(c, reg);
    const t0 = performance.now(), D = 750, ease = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
    // entre dois países: afasta um pouco no meio do caminho, como um voo

    const bub = [...document.querySelectorAll('#mb .cdot')];
    const step = now => {
      const k = Math.min(1, (now - t0) / D), e = ease(k);

  function discHTML() {
    const m = st.disc;
    return `<div class="view" id="dv"><div class="stack">
      <div class="topbar"><div class="brand">${I.mark}FenoSearch</div><button class="rb srch" data-tab="find" aria-label="Pesquisar" aria-current="${st.tab === 'find'}">${I.search}</button></div>
      <div class="sec" style="gap:6px"><p class="h1">Mapa</p><p class="sub">${st.mmode === 'sb' ? 'Onde ficam os seedbanks e o que cada um criou.' : 'De onde vem cada strain, por país e estado.'}</p></div>
      ${mapHTML()}
    </div></div>`;
  }

  // ---------- comparar ----------
  function ancOf(id) { const seen = new Set(), q = [...mp(by[id])]; while (q.length) { const x = q.shift(); if (seen.has(x)) continue; seen.add(x); q.push(...mp(by[x])); } return seen; }
  const PRESETS = [['og-kush', 'gsc'], ['blue-dream', 'sour-diesel'], ['northern-lights', 'white-widow'], ['cannatonic', 'charlotte-s-web'], ['gelato', 'wedding-cake']];
  function rangeBar(r, lo, hi, best) { const a = Math.max(0, (r[0] - lo) / (hi - lo)) * 100, b = Math.min(1, (r[1] - lo) / (hi - lo)) * 100; return `<span class="rbar${best ? ' best' : ''}"><i style="left:${a.toFixed(1)}%;width:${Math.max(4, b - a).toFixed(1)}%"></i></span>`; }
  function benchHTML() {

    const cols = slots.length;
    let body = '';
    if (n >= 2) {
      const mx = (f) => Math.max(...L.map(f)), mn = (f) => Math.min(...L.map(f));
      const row = (label, cells, note) => `<div class="crow"><p class="cl">${label}${note ? `<small>${note}</small>` : ''}</p><div class="cg" style="--n:${cols}">${cells.join('')}${cols > n ? '<span></span>' : ''}</div></div>`;
      const cell = (h, best) => `<div class="cv${best ? ' best' : ''}">${h}</div>`;
      const thcB = mx(s => s.thcx ? -1 : s.thc[1]), cbdB = mx(s => s.cbd[1]), flB = mn(s => s.fl[1]);
      const ancs = L.map(s => ancOf(s.id)), common = [...ancs[0]].filter(a => ancs.every(x => x.has(a))).map(a => by[a]).sort((a, b) => b.kids.length - a.kids.length);

        ${row('CBD', L.map(s => cell(`<b>${pt(s.cbd[0])} a ${pt(s.cbd[1])}%</b>${rangeBar(s.cbd, 0, 20, s.cbd[1] === cbdB && cbdB >= 1)}`, s.cbd[1] === cbdB && cbdB >= 1)))}
        ${row(L.some(s => s.f === 'auto') ? 'Floração ou ciclo' : 'Floração', L.map(s => cell(`<b>${s.fl[0]} a ${s.fl[1]} sem.</b>${rangeBar(s.fl, 5, 16, s.fl[1] === flB)}`, s.fl[1] === flB)), 'mais rápida em destaque')}
        ${row('Cultivo', L.map(s => cell(`<b>${s.d[0].toUpperCase() + s.d.slice(1)}</b><small>${grow(s).alt}</small>`, s.d === 'fácil')))}
        ${row('Efeitos mais relatados', L.map(s => cell(rep(s).ef.map((e, i) => `<span class="ef${i ? '' : ' top'}">${e.n}</span>`).join(''))))}
        ${row('Aroma', L.map(s => cell(aromas(s).map(a => `<span class="ef${commonA.includes(a) ? ' top' : ''}">${a}</span>`).join('') || '<small>sem dado</small>')))}
        ${row('Origem', L.map(s => cell(`<b>${esc(s.or.split(/,\s*depois/)[0].split(',').pop().trim())}</b><small>${[s.y, !NOBR.includes(s.br) ? esc(s.br) : null].filter(Boolean).join(' · ') || 'nativa'}</small>`)))}

        <div class="btns" style="margin-top:4px"><button class="btn" data-tree="${L[0].id}">Árvore de ${esc(L[0].n)}</button><button class="btn" data-cmpclear>Limpar tudo</button></div></div>`;
    } else {
      body = `<div class="sec"><p class="h3">Comparações populares</p><div class="pres">${PRESETS.filter(p => p.every(id => by[id])).map(p => `<button class="pre" data-preset="${p.join(',')}"><span class="pics">${p.map(id => pic(by[id])).join('')}</span><b>${p.map(id => esc(by[id].n)).join(' × ')}</b></button>`).join('')}</div></div>`;
    }
    return `<div class="view" id="bv"><div class="stack">
      <div class="topbar"><div class="brand">${I.mark}FenoSearch</div><button class="rb srch" data-tab="find" aria-label="Pesquisar" aria-current="false">${I.search}</button></div>
      <div class="sec" style="gap:6px"><p class="h1">Comparar</p><p class="sub">${n >= 2 ? `Comparando ${n} strains. Toque numa foto pra abrir a ficha.` : 'Escolha até 3 strains pra ver lado a lado. Também dá pra adicionar pelo botão Comparar de cada ficha.'}</p></div>
      <div class="cslots" style="--n:${cols}">${slots.map(slot).join('')}</div>

  // ---------- abas ainda não refeitas ----------
  const SOON = { bench: ['Comparar', 'A tela de comparar entra na etapa 6. Você já pode marcar strains pelo botão no canto da ficha.'] };
  const soonHTML = k => `<div class="view"><div class="soon"><div class="seed"></div><p class="h1" style="font-size:26px">${SOON[k][0]}</p><p class="sub" style="max-width:300px">${SOON[k][1]}</p>${k === 'bench' && st.cmp.length ? `<div class="chips" style="justify-content:center">${st.cmp.map(id => `<button class="chip" data-open="${id}">${esc(by[id].n)}</button>`).join('')}</div>` : ''}</div></div>`;
  const navHTML = () => `<nav class="nav"><span class="brand nbrand">${I.mark}FenoSearch</span>${[['home', 'Início', I.home], ['disc', 'Mapa', I.map], ['bench', 'Comparar' + (st.cmp.length ? ' · ' + st.cmp.length : ''), I.cmp]].map(([k, l, i]) => `<button data-tab="${k}" aria-current="${st.tab === k}">${i}${l}</button>`).join('')}<button class="nsrch" data-tab="find" aria-current="${st.tab === 'find'}">${I.search}Pesquisar</button></nav>`;

  function render(keep) {
    const sy = keep && document.getElementById(keep) ? document.getElementById(keep).scrollTop : 0;
    let h = (st.tab === 'home' ? dayHTML() : st.tab === 'find' ? homeHTML() : st.tab === 'disc' ? discHTML() : st.tab === 'bench' ? benchHTML() : soonHTML(st.tab)) + navHTML();

  }
  function toast(t) { st.toast = t; render(st.sheet.length ? 'sv' : st.tab === 'disc' ? 'dv' : st.tab === 'home' ? 'hv' : st.tab === 'bench' ? 'bv' : null); clearTimeout(toast.h); toast.h = setTimeout(() => { st.toast = null; const el = app.querySelector('.toast'); if (el) el.remove(); }, 2200); }
  function open(id) { st.sheet.push(id); st.recent = [id, ...st.recent.filter(x => x !== id)].slice(0, 8); store.set('recent', st.recent); st.wipe = true; render(); st.wipe = false; }
  function closeSheet() { const el = app.querySelector('.sheet'); const done = () => { st.sheet = []; render(st.search ? 'sres' : null); }; if (!el) return done(); if (el.classList.contains('out')) return; el.classList.remove('in'); void el.offsetWidth; el.classList.add('out'); setTimeout(done, 390); }
  function focusQ() { const q = document.getElementById('q'); if (q && window.matchMedia('(pointer: fine)').matches) { q.focus(); q.setSelectionRange(q.value.length, q.value.length); } }

  app.addEventListener('click', e => {
    if (st.dragged && e.target.closest('#msvg')) return;
    const t = e.target.closest('button, [data-intro-next], g[data-ctry], g[data-open], g[data-reg], g[data-sb]'); if (!t) return;

    if ('search' in d) { st.search = { q: '', f: {} }; render(); focusQ(); return; }
    if ('searchClose' in d) { st.search = null; render(); return; }
    if (d.intent) { st.search = { q: '', f: Object.assign({}, INTENT_F[d.intent]) }; render(); return; }
    if (d.fam) { st.search = { q: '', f: { fam: d.fam } }; render(); return; }
    if (d.f) { const v = d.f === 'fl' || d.f === 'auto' ? +d.v : d.v; const f = st.search.f; f[d.f] = f[d.f] === v ? null : v; if (d.f === 'auto' && f.auto) f.fl = null; if (d.f === 'fl' && f.fl) f.auto = null; render(); return; }
    if (d.open && st.search && st.search.pick) { const id = d.open; st.search = null; if (!st.cmp.includes(id) && st.cmp.length < 3) { st.cmp.push(id); store.set('cmp', st.cmp); } render('bv'); return; }
    if (d.open) { open(d.open); return; }
    if ('cmpadd' in d) { st.search = { q: '', f: {}, pick: true }; render(); focusQ(); return; }
    if (d.cmprm) { st.cmp = st.cmp.filter(x => x !== d.cmprm); store.set('cmp', st.cmp); render('bv'); return; }

    if (d.troot) { const T = st.tree; if (d.troot !== T.root) { T.hist.push(T.root); T.root = d.troot; T.all = false; render(st.sheet.length ? 'sv' : null); centerTree(); } return; }
    if ('tprev' in d) { const T = st.tree; T.root = T.hist.pop(); T.all = false; render(st.sheet.length ? 'sv' : null); centerTree(); return; }
    if ('tall' in d) { const c = document.getElementById('tcv'), x = c.scrollLeft, y = c.scrollTop; st.tree.all = true; render(st.sheet.length ? 'sv' : null); const c2 = document.getElementById('tcv'); c2.scrollLeft = x; c2.scrollTop = y; return; }
    if ('tclose' in d) { closeTree(); return; }
    if (d.topen) { st.tree = null; open(d.topen); return; }
    if ('back' in d) { closeSheet(); return; }
    if (d.cmp) { const id = d.cmp, i = st.cmp.indexOf(id); if (i >= 0) { st.cmp.splice(i, 1); store.set('cmp', st.cmp); toast('Tirada da comparação'); } else if (st.cmp.length >= 3) toast('Dá pra comparar até 3 strains'); else { st.cmp.push(id); store.set('cmp', st.cmp); toast(`${by[id].n} na comparação (${st.cmp.length} de 3)`); } return; }
  });
  app.addEventListener('input', e => { if (e.target.id === 'q') { st.search.q = e.target.value; const res = results(); const box = app.querySelector('#sres'); const any = st.search.q || Object.keys(st.search.f).some(k => st.search.f[k]); box.innerHTML = `<p class="count">${res.length} ${res.length === 1 ? 'strain' : 'strains'}</p><div class="res">${res.slice(0, 80).map(itemHTML).join('') || '<p class="empty">Nenhuma strain encontrada. Tente outro nome, efeito ou aroma.</p>'}</div>`; if (!any) render(); } });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') { if (st.tree) return closeTree(); if (st.sheet.length) return closeSheet(); else if (st.search) st.search = null; else return; render(); } });
  render();
})();
